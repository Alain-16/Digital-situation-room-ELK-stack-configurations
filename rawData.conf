input {
  http_poller {
    urls => {
      DHIS2_meta_data => {
        method => get
        url => "https://lg.risa.gov.rw/production/api/dataValueSets.json?children=true&dataElementGroup=v10sme9MjPS&orgUnit=QoptHf4izj7&lastUpdatedDuration=150d"
        headers => {
          Authorization => "Basic YmFpbHk6QmFpbHlAMjAyMw=="
        }
      }
    }
    request_timeout => 60
    automatic_retries => 3
    schedule => { cron => "*/3 * * * * UTC" }
    codec => "json"
    
  }
}



filter {

  if [http_request_failure] {
    drop { }
  }

  split {
    field => "[dataValues]"
  }

  mutate {
    rename => {
      "[dataValues][dataElement]" => "dataElement"
      "[dataValues][period]" => "period"
      "[dataValues][orgUnit]" => "orgUnit"
      "[dataValues][categoryOptionCombo]" => "categoryOptionCombo"
      "[dataValues][value]" => "value"
      "[dataValues][lastUpdated]" => "LastUpdated"
      "[dataValues][created]" => "Created"
    }
   add_field => { "initial_dataElementID" => "%{dataElement}" }
  }

    # Extract year and quarter from period using grok
  grok {
    match => { "period" => "(?<year>\d{4})(?<quarter>Q\d)" }
  }

    mutate {
    # Replace original period with year only and remove the `year` field afterward
    replace => { "period" => "%{year}" }
    remove_field => ["year"]
  }

  if ![tags] {
    # Lookup dataElement name
    elasticsearch {
      id => "elasticsearch_dataElement"
      hosts => ["$ELASTICSEARCH_HOSTS"]
      user => "$ELASTICSEARCH_USERNAME"
      password => "$ELASTICSEARCH_PASSWORD"
      ca_file => "/etc/logstash/security/ca/ca.crt"
      ssl => true
      index => "application.metadata"
      query => "_id:%{[dataElement]}"
      fields => { "[meta_data][name]" => "dataElementName" }
      tag_on_failure => ["_elasticsearch_lookup_failure_dataElement"]
    }

    # Lookup orgUnit name
    elasticsearch {
      id => "elasticsearch_orgUnit"
      hosts => ["$ELASTICSEARCH_HOSTS"]
      user => "$ELASTICSEARCH_USERNAME"
      password => "$ELASTICSEARCH_PASSWORD"
      ca_file => "/etc/logstash/security/ca/ca.crt"
      ssl => true
      index => "application.metadata"
      query => "_id:%{[orgUnit]}"
      fields => { "[meta_data][hierarchy]" => "orgUnitName" }
      tag_on_failure => ["_elasticsearch_lookup_failure_orgUnit"]
    }

    # Lookup categoryOptionCombo name
    elasticsearch {
      id => "elasticsearch_categoryOptionCombo"
      hosts => ["$ELASTICSEARCH_HOSTS"]
      user => "$ELASTICSEARCH_USERNAME"
      password => "$ELASTICSEARCH_PASSWORD"
      ca_file => "/etc/logstash/security/ca/ca.crt"
      ssl => true
      index => "application.metadata"
      query => "_id:%{[categoryOptionCombo]}"
      fields => { "[meta_data][name]" => "categoryOptionComboName" }
      tag_on_failure => ["_elasticsearch_lookup_failure_categoryOptionCombo"]
    }
  }

  mutate {
    rename => {
      "dataElementName" => "dataElement"
      "orgUnitName" => "orgUnit"
      "categoryOptionComboName" => "categoryOptionCombo"
    }
    convert => {
      "value" => "float"
    }
   
  }
  
    # Use Ruby to merge main and target dataElements
  ruby {
    init => "@event_map ||= {}"
    code => "
      # Split orgUnit into hierarchy components
      org_unit = event.get('orgUnit')
      if org_unit
        hierarchy = org_unit.split('/')
        event.set('Country', hierarchy[1] || '')
        event.set('Province', hierarchy[2] || '')
        event.set('District', hierarchy[3] || '')
        event.set('Sector', hierarchy[4] || '')
        event.set('Cell', hierarchy[5] || '')
        event.set('Village', hierarchy[6] || '')
      end

      # Remove the original orgUnit field
      event.remove('orgUnit')

      # Update categoryOptionCombo if it is \"default\"
      if event.get('categoryOptionCombo') == 'default'
        event.set('categoryOptionCombo', 'Not applicable')
      end

      # Handling merging main and target dataElements
      data_element = event.get('dataElement')
      if data_element.end_with?('_Target')
        main_data_element = data_element.gsub('_Target', '')
        if @event_map.key?(main_data_element)
          main_event = @event_map.delete(main_data_element)
          main_event.set('dataElement_Target', data_element)
          main_event.set('Target_value', event.get('value'))
          main_event.set('dataElement_TargetID', event.get('initial_dataElementID'))
          main_event.set('LastUpdated', event.get('LastUpdated'))
          event.overwrite(main_event)
        else
          @event_map[data_element] = event.clone
          event.cancel
        end
      else
        if @event_map.key?(data_element + '_Target')
          target_event = @event_map.delete(data_element + '_Target')
          event.set('dataElement_Target', target_event.get('dataElement'))
          event.set('Target_value', target_event.get('value'))
          event.set('dataElement_TargetID', target_event.get('initial_dataElementID'))
          event.set('LastUpdated', target_event.get('LastUpdated'))
        else
          @event_map[data_element] = event.clone
          event.cancel
        end
      end

      # Conditional setting of additional fields if the target exists
      if event.get('dataElement_Target')
        event.set('dataElement_TargetID', event.get('dataElement_TargetID'))
        event.set('Target_value', event.get('Target_value'))
      end
    "
  }

  mutate {
    rename =>{
      "initial_dataElementID" => "AchievedImihigoIndicator_ID"
      "dataElement" => "AchievedImihigoIndicator"
      "value" => "AchievedValue"
      "Target_value" => "TargetValue"
      "dataElement_TargetID" => "TargetImihigoIndicator_ID"
      "dataElement_Target" => "TargetImihigoIndicator"
      "categoryOptionCombo" => "IndicatorCategory"

    }
    remove_field => ["@version", "@timestamp", "dataValues"]
    remove_field => "[event][original]"
  }


    # Set Imihigo pillar based on AchievedImihigoIndicator prefix
  if [AchievedImihigoIndicator] =~ /ImihigoGov|imihigoGov/ {
    mutate { add_field => { "Imihigo pillar" => "Governance pillar" } }
  } else if [AchievedImihigoIndicator] =~ /ImihigoSoc|imihigoSoc/ {
    mutate { add_field => { "Imihigo pillar" => "Social pillar" } }
  } else if [AchievedImihigoIndicator] =~ /ImihigoEco|Imihigo/ {
    mutate { add_field => { "Imihigo pillar" => "Economic pillar" } }
  }else if [AchievedImihigoIndicator] =~ /imihigo|Imih/ {
    mutate { add_field => { "Imihigo pillar" => "Economic pillar" } }
  }

}



output {

 if ![tags] and ![http_request_failure] {

   elasticsearch{
          hosts => ["$ELASTICSEARCH_HOSTS"]
          user => "$ELASTICSEARCH_USERNAME"
          password => "$ELASTICSEARCH_PASSWORD"
          cacert => "/etc/logstash/security/ca/ca.crt"
          ssl => "true"
          ssl_certificate_verification => "true"
          index => "application.rawdata"
          document_id => "%{AchievedImihigoIndicator_ID}_%{AchievedImihigoIndicator}_%{period}_%{District}_%{IndicatorCategory}"   
        }



    stdout {
       codec => rubydebug
        }
}else{
    elasticsearch{
      hosts => ["$ELASTICSEARCH_HOSTS"]
      user => "$ELASTICSEARCH_USERNAME"
      password => "$ELASTICSEARCH_PASSWORD"
      cacert => "/etc/logstash/security/ca/ca.crt"
      ssl => "true"
      ssl_certificate_verification => "true"
      index => "error.connection"  
    
    }
  }


}
