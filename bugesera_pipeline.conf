        }
        auth => {
          user => "baily"
          password => "Baily@2023"
        }
      }
    }
    request_timeout => 60
    schedule => { cron => "* * * * * UTC"} # This schedules the poller to run every minute. Adjust as needed.
    codec => "json"
  }
}

filter {
  # Extract organisationUnitLevels and organisationUnits to create mappings
  ruby {
    init => "
      @level_mapping = {}
      @unit_mapping = {}
    "
    code => "
      if event.get('organisationUnitLevels')
        event.get('organisationUnitLevels').each { |item| @level_mapping[item['level']] = item['name'] }
      end

      if event.get('organisationUnits')
        event.get('organisationUnits').each { |item| @unit_mapping[item['id']] = item['name'] }
      end

      event.set('level_mapping', @level_mapping)
      event.set('unit_mapping', @unit_mapping)
    "
  }

  # Split each main key (e.g., dataSets, dataElements, etc.) into individual events
  split { field => "[dataSets]" }
  split { field => "[dataElements]" }
  split { field => "[organisationUnits]" }
  split { field => "[organisationUnitLevels]" }
  split { field => "[categoryCombos]" }

  # Process each item in the split arrays
  ruby {
    code => "
      item = event.to_hash
      key, value = item.first

      transformed_item = {
        '_index' => 'dhis2_metadata',
        '_type' => '_doc',
        '_id' => value['id'],
        '_source' => {
          'type' => key,
          'id' => value['id'],
          'name' => value['name'],
          'created' => value['created'],
          'lastUpdated' => value['lastUpdated']
        }
      }

      if key == 'organisationUnits'
        level_name = event.get('level_mapping')[value['level']]
        path_names = value['path'].split('/').map { |unit_id| event.get('unit_mapping')[unit_id] || unit_id }.join(' / ')
        transformed_item['_source'].merge!({ 'level' => level_name, 'path' => path_names })
      end

      if key == 'organisationUnitLevels'
        transformed_item['_source'].merge!({ 'level' => value['level'] })
      end

      event.overwrite(LogStash::Event.new(transformed_item))
    "
  }

  # Clean up temporary fields
  mutate {
    remove_field => ["level_mapping", "unit_mapping", "dataSets", "dataElements", "organisationUnits", "organisationUnitLevels", "categoryCombos"]
  }
}

output {

  # For debugging, you can also output to stdout
  stdout {
    codec => rubydebug
  }
}





