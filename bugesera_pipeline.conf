filter {
  if "http_request_failure" in [tags] {
    mutate {
      add_field => { "http_request_status" => "failed" }
    }
    drop {}
  } else {
    mutate {
      add_field => { "http_request_status" => "successful" }
    }
    
    # Extract organisationUnitLevels and organisationUnits to create mappings
    ruby {
      code => "
        level_mapping = event.get('organisationUnitLevels').map { |item| [item['level'], item['name']] }.to_h
        unit_mapping = event.get('organisationUnits').map { |item| [item['id'], item['name']] }.to_h
        event.set('level_mapping', level_mapping)
        event.set('unit_mapping', unit_mapping)
      "
    }

    # Split each main key (e.g., dataSets, dataElements, etc.) into individual events
    split {
      field => "[dataSets]"
    }
    split {
      field => "[dataElements]"
    }
    split {
      field => "[organisationUnits]"
    }
    split {
      field => "[organisationUnitLevels]"
    }
    split {
      field => "[categoryCombos]"
    }

    # Process each item in the split arrays
    ruby {
      code => "
        item = event.to_hash

        key = item.keys.first
        value = item[key]

        transformed_item = {
          '_index' => 'dhis2_metadata',
          '_type' => '_doc',
          '_id' => value['id'],
          '_source' => {
            'type' => key,
            'id' => value['id'],
            'name' => value['name'],
            'created' => value['created'],
            'lastUpdated' => value['lastUpdated']
          }
        }

        if key == 'organisationUnits'
          level_name = event.get('level_mapping')[value['level']]
          path_names = value['path'].split('/').map { |unit_id| event.get('unit_mapping')[unit_id] || unit_id }.join(' / ')
          transformed_item['_source'].merge!({ 'level' => level_name, 'path' => path_names })
        end

        if key == 'organisationUnitLevels'
          transformed_item['_source'].merge!({ 'level' => value['level'] })
        end

        event.overwrite(transformed_item)
      "
    }

    # Clean up temporary fields
    mutate {
      remove_field => ["level_mapping", "unit_mapping", "dataSets", "dataElements", "organisationUnits", "organisationUnitLevels", "categoryCombos"]
    }
  }
}

