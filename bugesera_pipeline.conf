ruby {
    code => '
      units = event.get("organisationUnits")
      return unless units

      unit_dict = {}
      units.each do |unit|
        unit_dict[unit["id"]] = unit
      end

      enriched_units = []
      units.each do |unit|
        enriched_unit = {
          "type_id" => "master_data_organisationUnits",
          "kpi_id" => unit["id"],
          "kpi_name" => unit["name"],
          "kpi_level" => unit["level"],
          "kpi_path" => unit["path"]
        }

        if unit["parent"]
          parent_id = unit["parent"]["id"]
          enriched_unit["kpi_parent_id"] = parent_id

          if unit_dict[parent_id]
            parent_unit = unit_dict[parent_id]
            enriched_unit["kpi_parent_level"] = parent_unit["level"]
            enriched_unit["kpi_organization_structure_level_1"] = parent_unit["name"] if parent_unit["level"] == 1
            enriched_unit["kpi_organization_structure_level_2"] = parent_unit["name"] if parent_unit["level"] == 2
            enriched_unit["kpi_organization_structure_level_3"] = parent_unit["name"] if parent_unit["level"] == 3
            enriched_unit["kpi_organization_structure_level_4"] = parent_unit["name"] if parent_unit["level"] == 4
            enriched_unit["kpi_organization_structure_level_5"] = parent_unit["name"] if parent_unit["level"] == 5
            enriched_unit["kpi_organization_structure_level_6"] = parent_unit["name"] if parent_unit["level"] == 6
            enriched_unit["kpi_organization_structure_level_7"] = parent_unit["name"] if parent_unit["level"] == 7
          end
        end

        enriched_units << enriched_unit
      end
      event.set("master_data", enriched_units)
    '
    tag_with_exception_message => true
    tag_on_exception => "ruby_enrichment_exception"
  }

  prune {
    whitelist_names => ["master_data"]
  }

  split {
    field => "master_data"
  }

 mutate {
      rename => { "kpi_name" => "organisation_name" }
      add_field => { "organisation_level_%{kpi_level}" => "%{organisation_name}" }
    }