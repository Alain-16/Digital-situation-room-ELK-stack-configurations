filter {
  mutate {
    add_field => ["targetIndex", "application.easternprovince.dhis-masterdata"]
  }

  ruby {
    code => '
      [
        ["dataElements", "name"],
        ["dataElementGroups", "name"],
        ["dataSets", "name"],
        ["organisationUnits", "name"],
        ["categoryCombos", "name"]
      ].each {|configArray|
        dict = Hash.new
        domain = configArray[0]
        name = configArray[1]
        domainNode = event.get(domain)
        if domainNode != nil 
          domainNode.each {|node|
            dict[node["id"]] = node[name]
          }
          event.set(domain + "_dict", dict)
        end
      }
      a = []
      [
        ["dataElements", "name", "id", "created", "lastUpdated"],
        ["dataElementGroups", "name", "id", "created", "lastUpdated"],
        ["dataSets", "name", "id", "created", "lastUpdated"],
        ["organisationUnits", "name", "id", "created", "lastUpdated"],
        ["categoryCombos", "name", "id", "created", "lastUpdated"]
      ].each {|configArray|
        domain = configArray[0]
        domainNode = event.get(domain)
        if domainNode != nil
          domainNode.each { |node|
            dict = Hash.new
            dict["type"] = "metadata_" + domain
            configArray.drop(1).each { |field|
              dict[field] = node[field]
            }
            a.push(dict)
          }
        end
      }
      event.set("master_data", a)
    '
    tag_with_exception_message => true
    tag_on_exception => "ruby_before_split"
  }

  prune {
    whitelist_names => ["master_data", "dict", "http", "target", "tag"]
  }

  if ![tags] {
    split {
      field => "[master_data]"
    }
  }

  

  if [type] == "metadata_organisationUnits" {
    if [parent] {
      elasticsearch {
        id => "easternprovince_organisationUnits"
        hosts => ["http://elasticsearch:9200"]
        index => "dhis_organisationunits"
        query => "_id:%{[parent][id]}"
        fields => {
          "[level]" => "[parent_level]"
        }
      }
    }
    mutate {
      copy => {"[name]" => "[organization_name]"}
    }
    mutate {
      rename => {"[name]" => "[organization_level_%{level}]"}
    }
  }

  mutate {
    remove_field => ["http_poller_metadata"]
  }
  
  prune {
    blacklist_names => ["master_data", "dict"]
  }
}


